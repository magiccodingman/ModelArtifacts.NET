name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ModelArtifacts.slnx
      - run: dotnet build ModelArtifacts.slnx --configuration Release --no-restore
      - run: dotnet test tests/ModelArtifacts.Tests/ModelArtifacts.Tests.csproj --configuration Release --no-build
